<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- App Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#f59e0b" stroke-width="6" stroke-opacity="0.25"/>

  <!-- Truck Icon Symbol inside Safe Zone -->
  <g transform="translate(64, 76) scale(0.75)" filter="url(#shadow)">
    <!-- Cabin & Body -->
    <path d="M40 120 C40 97.9 57.9 80 80 80 L280 80 C302.1 80 320 97.9 320 120 L320 300 L40 300 Z" fill="url(#amberGrad)"/>
    <path d="M320 160 L400 160 C417.7 160 433.8 171.8 438.8 188.8 L460 260 L460 300 C460 311 451 320 440 320 L40 320 C29 320 20 311 20 300 L20 140 C20 129 29 120 40 120 Z" fill="url(#amberGrad)"/>
    <!-- Windshield -->
    <path d="M336 176 L396 176 C404 176 411 182 414 190 L428 236 L336 236 Z" fill="#020617"/>
    <!-- Wheels -->
    <circle cx="120" cy="330" r="44" fill="#020617" stroke="#f59e0b" stroke-width="10"/>
    <circle cx="120" cy="330" r="18" fill="#f59e0b"/>
    <circle cx="360" cy="330" r="44" fill="#020617" stroke="#f59e0b" stroke-width="10"/>
    <circle cx="360" cy="330" r="18" fill="#f59e0b"/>
    <!-- Speed Lines -->
    <line x1="20" y1="180" x2="100" y2="180" stroke="#020617" stroke-width="10" stroke-linecap="round"/>
    <line x1="10" y1="220" x2="80" y2="220" stroke="#020617" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">ZUGGI</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="4">COMMERCIAL FREIGHT</text>
</svg>
